<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razer paiment</title>
  <link rel="stylesheet" href="razer.css/paiment.css">
</head>
<body>

<div class="checkout-container">

  <form class="checkout-form">

    <!-- Billing -->
    <div class="column">
      <h2>Informations</h2>

      <label> Nom et prenom</label>
      <input type="text" placeholder="Mohamed Abidi">

      <label>Email</label>
      <input type="email" placeholder="example@email.com">

      <label>Address</label>
      <input type="text" placeholder="Street - City">

      <label>ville</label>
      <input type="text" placeholder="Casablanca">

      <div class="row">
        <div>
          <label>nation</label>
          <input type="text" placeholder="Morocco">
        </div>
        <div>
          <label> Code</label>
          <input type="text" placeholder="20000">
        </div>
      </div>
    </div>

    
    <div class="column">
      <h2>Payment</h2>

      <div class="cards">
        <img src="https://img.icons8.com/color/48/visa.png">
        <img src="https://img.icons8.com/color/48/mastercard.png">
        <img src="https://img.icons8.com/color/48/paypal.png">
      </div>

      <label>Nom et prenom</label>
      <input type="text" placeholder="Mohamed Abidi">

      <label>Cart nomber</label>
      <input type="text" placeholder="1111 2222 3333 4444">

      <div class="row">
        <div>
          <label>jour</label>
          <input type="text" placeholder="01">
        </div>
        <div>
          <label>mois</label>
          <input type="text" placeholder="11">
        </div>
        <div>
          <label>annee</label>
          <input type="text" placeholder="2007">
          <button class="confirm-btn">Confirme</button>
        </div>
      </div>
    </div>

  </form>

</div>
<script>
const icons = document.querySelectorAll(".cards img");

// اختيار طريقة الدفع
icons.forEach(icon => {
  icon.addEventListener("click", () => {
    
    // نحيد active من الجميع
    icons.forEach(i => i.classList.remove("active"));

    // نضيف active للّي ضغطت عليه
    icon.classList.add("active");

  });
});
</script>

</body>
</html>
